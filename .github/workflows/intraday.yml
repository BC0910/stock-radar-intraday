name: Intraday ranking update

on:
  schedule:
    # 台灣時間約 11:05 / 13:05 (UTC+8) = UTC 03:05 / 05:05，只在週一到週五(台股交易日基礎範圍)觸發。
    # 刻意不排在整點(0分)：GitHub Actions 的 schedule trigger 在每個整點是全站最壅塞的時刻，
    # 官方文件明講整點附近容易延遲、甚至偶爾直接被跳過，尤其新建立沒多久的 workflow 更明顯
    # (第一次排程就沒觸發，符合這個已知現象)。錯開幾分鐘可以大幅降低被延遲/跳過的機率。
    - cron: "5 3 * * 1-5"
    - cron: "5 5 * * 1-5"
    # TEMP smoke test — 驗證 schedule trigger 本身有沒有被 GitHub 排進佇列，驗完就會移除這行
    - cron: "55 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python src/main.py --pages-url "$PAGES_URL"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: intraday update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
