name: Intraday ranking update

on:
  # GitHub 內建 schedule: 對新建立的 workflow 實測會延遲/完全不觸發(cron語法、UTC換算、Actions權限、
  # Telegram發送都個別驗證過沒問題，純粹是 GitHub 排程佇列本身不可靠)，已改成外部觸發 workflow_dispatch：
  # intraday_check ← Telegram「run」→ Cloudflare Worker；postclose_stats ← cron-job.org 17:00。
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday_check(盤中即時檢查) 或 postclose_stats(收盤後統計)"
        type: choice
        options:
          - intraday_check
          - postclose_stats
        default: intraday_check
        required: true

permissions:
  contents: write

concurrency:
  group: intraday-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          MODE: ${{ inputs.mode }}
        run: python src/main.py --mode "$MODE" --pages-url "$PAGES_URL"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: intraday update $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
